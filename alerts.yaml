# Hand-written alerts.
#
# The web UI does NOT touch this file - it owns alerts.json instead. Both are
# loaded and both run; names just have to be unique across the two. Use this
# file when you want comments and full control, and the UI for everything else.
#
# Test any change without emailing or saving state:
#     python mercari_alert.py --dry-run --only <name> --explain
#
# Field reference is in README.md.

alerts:
- name: example-retro-game
  paused: true
  label: 'EXAMPLE: SFC game, boxed'
  queries:
  - スーパーファミコン 箱説
  - スーファミ 完品
  match:
    require:
    - - スーパーファミコン
      - スーファミ
      - SFC
    signals:
      箱説: 4.0
      完品: 3.0
      取扱説明書: 2.0
      動作確認済: 1.0
    exclude:
    - ソフトのみ
    - カセットのみ
    - 端子のみ
    min_score: 5.0
    scope: full
  presets:
  - no_junk
  price_max: 20000
  min_interval_minutes: 30
- name: example-jump-issue
  paused: true
  label: 'EXAMPLE: Weekly Shonen Jump 1997 issue 43'
  queries:
  - 週刊少年ジャンプ 1997 43号
  - 少年ジャンプ 1997年 43
  - ジャンプ 43号 1997
  match:
    require:
    - - 週刊少年ジャンプ
      - 少年ジャンプ
      - ジャンプ
    signals:
      1997年: 6.0
      43号: 8.0
      付録: 1.0
      表紙: 1.0
    exclude:
    - 切り抜き
    - 抜けあり
    - コピー
    - 複製版
    - ページのみ
    min_score: 9.0
    scope: full
  min_interval_minutes: 60
