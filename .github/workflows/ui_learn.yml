name: UI Learn

# Dispatched by the web UI when you paste example listings into the
# new-alert wizard. Fetches each example, derives a query fan-out and
# weighted match rules, and commits the proposal to
# ui/data/learned/<request_id>.json for the page to pick up.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque id the UI polls for"
        required: true
      payload:
        description: "JSON: {examples: [url...], negatives: [url...], name, label}"
        required: true

permissions:
  contents: write

concurrency:
  group: mercari-ui-tasks
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Learn from examples
        env:
          TASK_PAYLOAD: ${{ inputs.payload }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python tools/ui_task.py learn --id "$REQUEST_ID"

      - name: Commit result
        if: always()
        run: |
          git config user.name "mercari-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ui/data/learned .term_counts.json || true
          if git diff --cached --quiet; then
            echo "No learn output to commit."
          else
            git commit -m "UI learn ${{ inputs.request_id }} [skip ci]"
            git pull --rebase --autostash
            git push
          fi
