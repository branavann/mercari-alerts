name: UI Preview

# Dispatched by the web UI when you click "Preview" in the new-alert wizard.
# Runs the draft alert against live Mercari and commits the result under
# ui/data/previews/<request_id>.json, which the page polls for.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque id the UI polls for"
        required: true
      payload:
        description: "JSON: {alert: {...}}"
        required: true

permissions:
  contents: write

concurrency:
  group: mercari-ui-tasks       # shared with UI Learn - they both commit
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run preview
        # The payload reaches Python through the environment, never through a
        # shell command line, so its contents can't be interpreted as script.
        env:
          TASK_PAYLOAD: ${{ inputs.payload }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python tools/ui_task.py preview --id "$REQUEST_ID"

      - name: Commit result
        if: always()
        run: |
          git config user.name "mercari-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ui/data/previews || true
          if git diff --cached --quiet; then
            echo "No preview output to commit."
          else
            git commit -m "UI preview ${{ inputs.request_id }} [skip ci]"
            git pull --rebase --autostash
            git push
          fi
